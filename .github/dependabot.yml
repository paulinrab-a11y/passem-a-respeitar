version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      # Conventional Commits, senao o Commitlint recusa o PR do Dependabot.
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # Patch e minor agrupados num PR so: sao os que quase sempre entram
      # direto. Major fica separado, um por PR, porque exige leitura.
      patch-e-minor:
        applies-to: version-updates
        update-types: [patch, minor]
      seguranca:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # three e gsap comandam o visual da home e nenhum teste automatico pega
      # regressao de animacao: lint, typecheck e build passam com a intro
      # quebrada. Subir esses dois exige olho humano no site, entao fica fora
      # do update automatico e vira trabalho deliberado.
      #
      # three: a versao moderna remove THREE.sRGBEncoding, que o script usa.
      # gsap: 3.15.0 entrou num PR agrupado e so foi conferido depois, na mao.
      # Patch de seguranca continua passando nos dois.
      - dependency-name: three
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@types/three'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: gsap
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
