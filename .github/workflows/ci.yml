name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancela execucao antiga quando chega commit novo no mesmo PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Somente leitura: nada neste workflow escreve no repositorio.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Biome (lint + format)
        run: npm run lint
      - name: Knip (codigo e dependencia mortos)
        run: npm run knip

  typecheck:
    name: typecheck
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: test
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Com cobertura, nao so `test`: o piso configurado no vitest.config.ts
      # reprova o job quando a cobertura de lib/ cai. Sem isso, a cobertura
      # seria um numero que ninguem olha.
      - name: Testes com cobertura
        run: npm run test:coverage
      - name: Guardar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cobertura
          path: coverage/
          retention-days: 7

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks varre o historico, entao precisa do historico inteiro.
          fetch-depth: 0
      # Binario direto em vez da action oficial: a gitleaks-action pede chave de
      # licenca para conta de organizacao. O binario e MIT e nao pede nada.
      - name: Instala gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks version
      - name: Varre o historico
        run: ./gitleaks git . --redact --no-banner
      - name: Varre a arvore de trabalho
        run: ./gitleaks dir . --redact --no-banner

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Regra do AGENTS.md: nada de vulnerabilidade alta ou critica.
      - name: npm audit
        run: npm audit --audit-level=high
