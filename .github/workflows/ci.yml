name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancela execucao antiga quando chega commit novo no mesmo PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Somente leitura: nada neste workflow escreve no repositorio.
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  # Valor sem valor nenhum: entra no build como se fosse a chave secreta do
  # Supabase, e depois e procurado no .next. Se aparecer, a chave de verdade
  # tambem apareceria. Ver o job `build`.
  CANARIO: sb_secret_CANARIO_DO_CI_NAO_PODE_VAZAR

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Biome (lint + format)
        run: npm run lint
      - name: Knip (codigo e dependencia mortos)
        run: npm run knip

  typecheck:
    name: typecheck
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: test
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Com cobertura, nao so `test`: o piso configurado no vitest.config.ts
      # reprova o job quando a cobertura de lib/ cai. Sem isso, a cobertura
      # seria um numero que ninguem olha.
      - name: Testes com cobertura
        run: npm run test:coverage
      - name: Guardar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/
          retention-days: 7

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Valores falsos de proposito. Nenhum deles vale nada; o que interessa e
      # que a chave secreta seja um canario reconhecivel no passo seguinte.
      # O build nao fala com o Supabase: as rotas sao force-dynamic.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://projeto-falso.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_falsa_do_ci
          SUPABASE_SECRET_KEY: ${{ env.CANARIO }}

      # A terceira trava da chave secreta (#21). As outras duas sao o
      # `import 'server-only'` e a ausencia do prefixo NEXT_PUBLIC_.
      #
      # Conferido na mao que a busca enxerga: plantando o canario num arquivo
      # dentro de .next, ela acha. Nao e um grep que nunca casa com nada.
      - name: Chave secreta fora do output do build
        run: |
          if grep -rl "$CANARIO" .next; then
            echo "::error::A chave secreta apareceu no output do build (arquivos acima)."
            exit 1
          fi
          echo "Canario nao aparece em nenhum arquivo do .next."

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks varre o historico, entao precisa do historico inteiro.
          fetch-depth: 0
      # Binario direto em vez da action oficial: a gitleaks-action pede chave de
      # licenca para conta de organizacao. O binario e MIT e nao pede nada.
      - name: Instala gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks version
      - name: Varre o historico
        run: ./gitleaks git . --redact --no-banner
      - name: Varre a arvore de trabalho
        run: ./gitleaks dir . --redact --no-banner

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Regra do AGENTS.md: nada de vulnerabilidade alta ou critica.
      - name: npm audit
        run: npm audit --audit-level=high

  # Ponta a ponta (#10): o build de producao do site, num navegador de verdade,
  # falando com um Supabase que nasce e morre dentro deste job.
  #
  # Nenhum secret entra aqui. As chaves sao as do banco local, lidas do
  # `supabase status` na hora; producao nao e alcancada em nenhum passo, e a
  # propria suite se recusa a rodar contra endereco que nao seja da maquina.
  e2e:
    name: e2e
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Sobe o banco e aplica TODAS as migrations do repositorio num banco
      # vazio. Migration que so funciona em cima do banco de producao quebra
      # aqui, e nao no dia em que for preciso recriar o banco.
      - name: Supabase local
        run: npm run e2e:banco
      # Navegador em cache, chave pela versao exata do Playwright (#251). O
      # binario e o que mais demora para baixar; as dependencias do sistema
      # (apt) nao vao para o cache e sao instaladas sempre.
      - name: Versao do Playwright
        id: playwright
        run: echo "versao=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache do Chromium
        id: cache-chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}
      # Em 07/10/2026 este passo travou ate o teto de 25 min do job: o espelho
      # do Ubuntu parou no meio de um download do apt. Tres defesas:
      #   1. o proprio apt desiste de conexao parada em 30 s e tenta de novo
      #      (Acquire::Retries), em vez de esperar para sempre;
      #   2. cada tentativa inteira tem 5 min;
      #   3. entre tentativas, apt preso e encerrado. O `timeout` mata o npx,
      #      mas o apt-get roda via sudo em outro terminal (use_pty) e
      #      sobrevivia segurando a trava do dpkg — as tentativas seguintes
      #      morriam em "Could not get lock".
      - name: Chromium
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-rede > /dev/null
          if [ "${{ steps.cache-chromium.outputs.cache-hit }}" = "true" ]; then
            comando="npx playwright install-deps chromium"
          else
            comando="npx playwright install --with-deps chromium"
          fi
          for tentativa in 1 2 3; do
            if timeout 300 $comando; then exit 0; fi
            echo "::warning::Chromium: tentativa $tentativa falhou ou passou de 5 min"
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sleep 5
            sudo dpkg --configure -a || true
          done
          exit 1
      - name: Testes de ponta a ponta
        run: npm run test:e2e
      - name: Guardar relatorio
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Derruba o banco
        if: always()
        run: npm run e2e:banco:parar
